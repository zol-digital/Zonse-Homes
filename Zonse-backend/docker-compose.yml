version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: zonse_db
    restart: always
    environment:
      POSTGRES_USER: zonse_user
      POSTGRES_PASSWORD: zonse_password
      POSTGRES_DB: zonse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonse_user -d zonse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: zonse_api
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql://zonse_user:zonse_password@db:5432/zonse_db
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data: