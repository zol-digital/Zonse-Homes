services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zonse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonse_password}
      POSTGRES_DB: ${POSTGRES_DB:-zonse_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    # Compose is the local development workflow; the image default is production-safe.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      POSTGRES_SERVER: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-zonse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zonse_password}
      POSTGRES_DB: ${POSTGRES_DB:-zonse_db}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-zonse_session}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-86400}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_CSRF_TRUSTED_ORIGINS: ${SESSION_CSRF_TRUSTED_ORIGINS:-}
    volumes:
      - .:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
